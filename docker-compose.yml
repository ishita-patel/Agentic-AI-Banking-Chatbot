version: "3.9"

services:

  jaeger:
    image: jaegertracing/all-in-one:latest

    ports:
      - "16686:16686"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:

    image: otel/opentelemetry-collector-contrib:latest

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml

    ports:
      - "4317:4317"

    depends_on:
      - jaeger